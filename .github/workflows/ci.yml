name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore DeepEqual.Generator.sln -warnaserror:NU1901,NU1902,NU1903,NU1904
      - run: dotnet build DeepEqual.Generator.sln -c Release --no-restore
      - run: dotnet test DeepEqual.Generator.Tests/DeepEqual.Generator.Tests.csproj -c Release --no-build
      - run: dotnet pack DeepEqual.Generator.Shared/DeepEqual.Generator.Shared.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet restore samples/OrderComparison/OrderComparison.csproj --source artifacts/packages --packages artifacts/smoke-cache
      - run: dotnet run --project samples/OrderComparison/OrderComparison.csproj -c Release --no-restore
      - run: dotnet restore samples/DeltaRoundTrip/DeltaRoundTrip.csproj --source artifacts/packages --packages artifacts/smoke-cache
      - run: dotnet run --project samples/DeltaRoundTrip/DeltaRoundTrip.csproj -c Release --no-restore
      - run: dotnet restore samples/HtmlReportCi --configfile samples/HtmlReportCi/LocalPackage.NuGet.Config --packages artifacts/html-cache -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Test the packaged HTML report example
        shell: pwsh
        run: ./samples/HtmlReportCi/Verify-Report.ps1
      - name: Verify packaged sync under Native AOT
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $feed = [System.Security.SecurityElement]::Escape((Resolve-Path artifacts/packages).Path)
          $config = Join-Path (Get-Location) 'artifacts/aot-nuget.config'
          ('<configuration><packageSources><clear/><add key="local" value="' + $feed + '"/><add key="nuget" value="https://api.nuget.org/v3/index.json" protocolVersion="3"/></packageSources></configuration>') | Set-Content $config
          dotnet restore samples/DeltaRoundTrip/DeltaRoundTrip.csproj --configfile $config --packages artifacts/aot-cache -r win-x64 -p:PublishAot=true -warnaserror:NU1901,NU1902,NU1903,NU1904
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish samples/DeltaRoundTrip/DeltaRoundTrip.csproj -c Release -r win-x64 --no-restore -p:PublishAot=true -p:TrimmerSingleWarn=false -p:TreatWarningsAsErrors=true -p:IlcTreatWarningsAsErrors=true -o artifacts/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/native/DeltaRoundTrip.exe
          exit $LASTEXITCODE
